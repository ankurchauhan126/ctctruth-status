# Upptime configuration for the CTCtruth status page.
# Copy this file to the root of the public status repository (see README.md) and replace
# OWNER and REPO. Nothing in it is secret.
owner: ankurchauhan126
repo: ctctruth-status

sites:
  - name: Portal sign-in
    url: https://app.ctctruth.com/signin
    expectedStatusCodes:
      - 200
  - name: Marketing site
    url: https://ctctruth.com/
    expectedStatusCodes:
      - 200
  # A neutral offer link: 43 "A" characters is a well-formed token that no offer uses, so the portal
  # answers 200 with its "Link not valid" page. It reads no offer and no salary.
  # The text check is a Upptime option; see the README note.
  - name: Candidate offer link
    url: https://app.ctctruth.com/o/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: Link not valid

# Run each check every 5 minutes (GitHub's shortest schedule).
workflowSchedule:
  uptime: "*/5 * * * *"

status-website:
  name: CTCtruth status
  introTitle: CTCtruth status
  introMessage: Live checks of the CTCtruth website and recruiter portal.
  # Served from GitHub Pages at https://OWNER.github.io/REPO/ unless you add a cname.

commitMessages:
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [$STATUS_PAGE_NAME]"
